name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_test
      AUTH_SECRET: ci-test-secret-minimum-32-characters-long
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: school-management-system/package-lock.json

      - name: Install dependencies
        working-directory: school-management-system
        run: npm ci

      - name: Generate Prisma client
        working-directory: school-management-system
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: school-management-system
        run: npx prisma migrate deploy

      - name: Lint
        working-directory: school-management-system
        run: npm run lint

      - name: Build
        working-directory: school-management-system
        run: npm run build
